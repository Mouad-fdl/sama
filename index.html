      font-weight: 500;
      font-size: 13px;

      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }
    .grid {

    }

      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;

    }

      border-color: #38bdf8;
    }

      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      gap: 8px;
    }

      font-weight: 700;
      color: #f8fafc;
      line-height: 1.35;
    }

      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

      color: #4ade80;
      font-size: 11px;
      font-weight: 600;
      margin-top: 4px;
    }

      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 14px;
      line-height: 1.4;
    }

      width: 100%;
      text-align: center;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      transition: background 0.2s;
    }
    .apply-btn:hover {
      background: #1d4ed8;
    }
    .footer {
      text-align: center;
      margin-top: 40px;
      color: #64748b;
      font-size: 12px;
    }
  </style>

    let currentFilter = 'ALL';

    function renderJobs() {
      const grid = document.getElementById('jobsGrid');
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      grid.innerHTML = '';

      let count = 0;
      jobsData.forEach(job => {
        const matchesCategory = (currentFilter === 'ALL') || 
                                (job.category.toLowerCase().includes(currentFilter.toLowerCase())) ||
                                (job.title.toLowerCase().includes(currentFilter.toLowerCase()));
        const matchesSearch = job.title.toLowerCase().includes(searchVal) || 
                              job.category.toLowerCase().includes(searchVal) ||
                              job.source.toLowerCase().includes(searchVal);

        if (matchesCategory && matchesSearch) {
          count++;
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div>
              <div class="card-top">
                <div class="card-title">${job.title}</div>
                <div class="match-badge">${job.match_score}% Match</div>
              </div>
              <div class="card-meta">
                📍 ${job.location} • 🏷️ ${job.category}<br>
                📡 Source: ${job.source}<br>
                <span class="verified-tag">✓ Lien Vérifié & Actif</span>
              </div>
            </div>
            <div class="card-action">
              <a href="${job.url}" target="_blank" class="apply-btn">🚀 Voir l'opportunité / Postuler</a>
            </div>
          `;
          grid.appendChild(card);
        }
      });

      document.getElementById('stats-count').innerText = `${count} Opportunités Validées`;
    }

    function filterCategory(cat) {
      currentFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderJobs();
    }

    document.getElementById('searchInput').addEventListener('input', renderJobs);
    renderJobs();
  </script>
